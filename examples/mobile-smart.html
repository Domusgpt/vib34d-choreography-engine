<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIB34D Mobile Maestro</title>
    <link rel="stylesheet" href="./css/ultimate-console.css">
</head>
<body>
    <div id="appShell">
        <canvas id="mainCanvas"></canvas>
        <div id="consoleHost"></div>
    </div>
    <script type="module">
        import { launchUltimateConsole } from './js/ultimateConsole.js';
        try {
            await launchUltimateConsole({
                canvasId: 'mainCanvas',
                hostId: 'consoleHost',
                layout: 'mobile',
            });
        } catch (error) {
            console.error('Failed to launch Mobile Maestro console', error);
        }
    </script>
</body>
</html>
