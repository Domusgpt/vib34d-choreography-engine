<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIB34D Mobile Maestro</title>
    <meta http-equiv="refresh" content="0; url=./ultimate-reactive.html?layout=mobile">
    <style>
        :root {
            color-scheme: dark;
            font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
            background: #01070a;
            color: #d6fff9;
        }

        body {
            display: grid;
            place-items: center;
            height: 100vh;
            margin: 0;
            padding: 24px;
            background: radial-gradient(circle at top, rgba(0, 140, 255, 0.18), transparent 55%), #01070a;
        }

        .redirect-card {
            max-width: 420px;
            padding: 28px;
            border-radius: 18px;
            background: rgba(0, 18, 28, 0.92);
            border: 1px solid rgba(0, 255, 255, 0.24);
            box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55);
            text-align: center;
        }

        h1 {
            margin: 0 0 12px 0;
            font-size: 1.4rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #00f0ff;
        }

        p {
            margin: 0 0 18px 0;
            line-height: 1.55;
            color: rgba(200, 255, 255, 0.82);
            font-size: 0.95rem;
        }

        a {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 999px;
            border: 1px solid rgba(0, 255, 255, 0.45);
            background: rgba(0, 255, 255, 0.1);
            color: #00f0ff;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            text-decoration: none;
        }

        a:hover,
        a:focus-visible {
            background: rgba(0, 255, 255, 0.18);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.25);
        }
    </style>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const target = new URL('./ultimate-reactive.html?layout=mobile', window.location.href);
            try {
                window.location.replace(target.toString());
            } catch (err) {
                console.warn('Automatic redirect blocked, showing manual link.', err);
            }
        });
    </script>
</head>
<body>
    <div class="redirect-card">
        <h1>Redirecting…</h1>
        <p>The Mobile Maestro experience now lives inside the unified Ultimate Reactive Console. We’re sending you there automatically.</p>
        <a href="./ultimate-reactive.html?layout=mobile">Open Unified Console</a>
    </div>
</body>
</html>
