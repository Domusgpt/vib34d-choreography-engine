<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIB34D Enhanced Choreography</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: block;
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 20, 0, 0.95);
            padding: 20px;
            border: 2px solid #0f0;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
            z-index: 1000;
        }

        h1 {
            color: #0ff;
            font-size: 1.5em;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #0ff;
        }

        h2 {
            color: #0ff;
            font-size: 1.1em;
            margin: 15px 0 10px 0;
        }

        button {
            background: #0f0;
            color: #000;
            border: none;
            padding: 8px 15px;
            margin: 3px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        button:hover {
            background: #0ff;
            box-shadow: 0 0 15px #0ff;
        }

        button.active {
            background: #f0f;
            box-shadow: 0 0 15px #f0f;
        }

        .status {
            margin: 10px 0;
            padding: 10px;
            background: rgba(0, 255, 0, 0.1);
            border-left: 3px solid #0f0;
            font-size: 0.9em;
        }

        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin: 10px 0;
        }

        .audio-section {
            background: rgba(0, 100, 255, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #0ff;
        }

        .threshold-control {
            background: rgba(255, 100, 0, 0.1);
            padding: 10px;
            margin: 10px 0;
            border-left: 3px solid #f80;
        }

        .slider-group {
            margin: 10px 0;
        }

        .slider-group label {
            display: block;
            margin: 5px 0;
            font-size: 0.85em;
        }

        input[type="range"] {
            width: 100%;
            margin: 5px 0;
        }

        input[type="file"] {
            background: rgba(0, 255, 0, 0.2);
            color: #0f0;
            border: 1px solid #0f0;
            padding: 5px;
            font-family: 'Courier New', monospace;
            width: 100%;
            margin: 5px 0;
        }

        #log {
            max-height: 150px;
            overflow-y: auto;
            font-size: 0.75em;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px;
            margin-top: 10px;
        }

        .log-entry {
            margin: 2px 0;
            color: #0f0;
        }

        .log-entry.beat {
            color: #ff0;
        }

        .log-entry.sequence {
            color: #0ff;
            font-weight: bold;
        }

        .log-entry.onset {
            color: #f0f;
            font-weight: bold;
        }

        .value-display {
            color: #0ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <canvas id="mainCanvas"></canvas>
    </div>

    <div id="controls">
        <h1>🌌 VIB34D Enhanced</h1>

        <div class="status">
            <strong>System:</strong> <span id="systemName">Quantum</span><br>
            <strong>Status:</strong> <span id="status">Running</span><br>
            <strong>Beat:</strong> <span id="beat">0</span> |
            <strong>BPM:</strong> <span id="bpm">128</span>
        </div>

        <div class="audio-section">
            <h2>🎵 Audio</h2>
            <input type="file" id="audioFile" accept="audio/*">
            <div class="btn-group">
                <button id="playBtn">▶️ Play</button>
                <button id="pauseBtn">⏸️ Pause</button>
            </div>
            <div style="margin-top: 10px;">
                <strong>Audio Levels:</strong><br>
                Bass: <span class="value-display" id="bassLevel">0%</span> |
                Mid: <span class="value-display" id="midLevel">0%</span> |
                High: <span class="value-display" id="highLevel">0%</span><br>
                Energy: <span class="value-display" id="energyLevel">0%</span> |
                Onset: <span class="value-display" id="onsetLevel">0%</span>
            </div>
        </div>

        <div class="threshold-control">
            <h2>🎚️ Detection Thresholds</h2>
            <div class="slider-group">
                <label>Onset Threshold: <span id="onsetThreshVal">0.85</span></label>
                <input type="range" id="onsetThresh" min="0.5" max="0.99" step="0.01" value="0.85">
            </div>
            <div class="slider-group">
                <label>Bass Threshold: <span id="bassThreshVal">0.83</span></label>
                <input type="range" id="bassThresh" min="0.5" max="0.99" step="0.01" value="0.83">
            </div>
            <div class="slider-group">
                <label>Visual Intensity: <span id="intensityVal">1.0</span></label>
                <input type="range" id="intensitySlider" min="0.3" max="1.5" step="0.05" value="1.0">
            </div>
            <div class="slider-group">
                <label>Grid Density: <span id="densityVal">25</span></label>
                <input type="range" id="densitySlider" min="10" max="50" step="1" value="25">
            </div>
        </div>

        <h2>🎨 System</h2>
        <div class="btn-group">
            <button class="system-btn active" data-system="quantum">Quantum</button>
            <button class="system-btn" data-system="faceted">Faceted</button>
            <button class="system-btn" data-system="holographic">Holographic</button>
        </div>

        <h2>▶️ Choreography</h2>
        <div class="btn-group">
            <button id="stopChoreography">Stop Engine</button>
            <button id="clearSequences">Clear Active</button>
        </div>

        <h2>🌀 Rotation Pattern</h2>
        <div class="btn-group" id="rotationPatterns"></div>

        <h2>💥 Trigger Sequence</h2>
        <div class="btn-group" id="sequences"></div>

        <h2>📊 Live Log</h2>
        <div id="log"></div>
    </div>

    <script type="module">
        import { ChoreographyEngine } from '../src/core/ChoreographyEngine.js';
        import { RotationChoreographer } from '../src/choreographers/RotationChoreographer.js';
        import { ShaderChoreographer } from '../src/choreographers/ShaderChoreographer.js';
        import { QuantumHolographicVisualizer } from '../src/visualizers/quantum/QuantumVisualizer.js';
        import { IntegratedHolographicVisualizer } from '../src/visualizers/faceted/FacetedVisualizer.js';
        import { HolographicVisualizer } from '../src/visualizers/holographic/HolographicVisualizer.js';
        import { AudioAnalyzer } from '../src/audio/AudioAnalyzer.js';

        const canvas = document.getElementById('mainCanvas');
        canvas.width = window.innerWidth * (window.devicePixelRatio || 1);
        canvas.height = window.innerHeight * (window.devicePixelRatio || 1);

        let currentVisualizer = null;
        let currentSystem = 'quantum';
        let audioAnalyzer = null;
        let audioContext = null;
        let audioElement = null;

        // Enhanced thresholds - adjustable
        let onsetThreshold = 0.85;
        let bassThreshold = 0.83;

        // Initialize with Quantum
        currentVisualizer = new QuantumHolographicVisualizer('mainCanvas', 'content', 1.0, 0);
        currentVisualizer.updateParameter('intensity', 1.0);
        currentVisualizer.updateParameter('hue', 180);
        currentVisualizer.updateParameter('saturation', 1.0);
        currentVisualizer.updateParameter('gridDensity', 25);

        const engine = new ChoreographyEngine({
            visualizers: [currentVisualizer],
            audioAnalyzer: null,
            bpm: 128
        });

        const rotationChoreographer = new RotationChoreographer();
        const shaderChoreographer = new ShaderChoreographer(currentVisualizer);

        await engine.loadSequenceLibrary('../src/sequences/presets/bass-drops.json');

        // UI elements
        const statusEl = document.getElementById('status');
        const systemNameEl = document.getElementById('systemName');
        const beatEl = document.getElementById('beat');
        const bpmEl = document.getElementById('bpm');
        const logEl = document.getElementById('log');

        // Audio level displays
        const bassLevelEl = document.getElementById('bassLevel');
        const midLevelEl = document.getElementById('midLevel');
        const highLevelEl = document.getElementById('highLevel');
        const energyLevelEl = document.getElementById('energyLevel');
        const onsetLevelEl = document.getElementById('onsetLevel');

        // Log function
        function log(message, type = 'default') {
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logEl.insertBefore(entry, logEl.firstChild);
            while (logEl.children.length > 50) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        // Override engine events
        const originalOnBeat = engine.onBeat.bind(engine);
        engine.onBeat = (beatInMeasure, audioData) => {
            originalOnBeat(beatInMeasure, audioData);
            if (beatInMeasure === 0) {
                log(`🥁 Measure ${engine.currentMeasure}`, 'beat');
            }
            beatEl.textContent = engine.currentBeat;
        };

        const originalOnOnset = engine.onOnset.bind(engine);
        engine.onOnset = (intensity, time) => {
            originalOnOnset(intensity, time);
            log(`⚡ Onset (${(intensity * 100).toFixed(0)}%)`, 'onset');
        };

        const originalStartSequence = engine.startSequence.bind(engine);
        engine.startSequence = (name, startTime) => {
            originalStartSequence(name, startTime);
            log(`🎬 ${name}`, 'sequence');
        };

        // Threshold controls
        document.getElementById('onsetThresh').oninput = (e) => {
            onsetThreshold = parseFloat(e.target.value);
            document.getElementById('onsetThreshVal').textContent = onsetThreshold.toFixed(2);
        };

        document.getElementById('bassThresh').oninput = (e) => {
            bassThreshold = parseFloat(e.target.value);
            document.getElementById('bassThreshVal').textContent = bassThreshold.toFixed(2);
        };

        document.getElementById('intensitySlider').oninput = (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('intensityVal').textContent = val.toFixed(2);
            currentVisualizer.updateParameter('intensity', val);
        };

        document.getElementById('densitySlider').oninput = (e) => {
            const val = parseInt(e.target.value);
            document.getElementById('densityVal').textContent = val;
            currentVisualizer.updateParameter('gridDensity', val);
        };

        // System switching
        document.querySelectorAll('.system-btn').forEach(btn => {
            btn.onclick = () => {
                const system = btn.dataset.system;

                if (currentVisualizer && currentVisualizer.destroy) {
                    currentVisualizer.destroy();
                }

                if (system === 'quantum') {
                    currentVisualizer = new QuantumHolographicVisualizer('mainCanvas', 'content', 1.0, 0);
                    systemNameEl.textContent = 'Quantum';
                } else if (system === 'faceted') {
                    currentVisualizer = new IntegratedHolographicVisualizer('mainCanvas', 'content', 1.0, 0);
                    systemNameEl.textContent = 'Faceted';
                } else if (system === 'holographic') {
                    currentVisualizer = new HolographicVisualizer('mainCanvas', 'content', 1.0, 0);
                    systemNameEl.textContent = 'Holographic';
                }

                const intensity = parseFloat(document.getElementById('intensitySlider').value);
                const density = parseInt(document.getElementById('densitySlider').value);
                currentVisualizer.updateParameter('intensity', intensity);
                currentVisualizer.updateParameter('hue', 180);
                currentVisualizer.updateParameter('saturation', 1.0);
                currentVisualizer.updateParameter('gridDensity', density);

                engine.visualizers = [currentVisualizer];
                currentSystem = system;

                document.querySelectorAll('.system-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');

                log(`🎨 Switched to ${system}`);
            };
        });

        // Audio handling - BULLETPROOF VERSION
        document.getElementById('audioFile').onchange = async (e) => {
            const file = e.target.files[0];
            if (!file) {
                log('❌ No file selected');
                return;
            }

            try {
                log(`📁 Loading: ${file.name}`);

                // Clean up old audio
                if (audioElement) {
                    audioElement.pause();
                    audioElement.src = '';
                }

                // Create URL and audio element
                const url = URL.createObjectURL(file);
                audioElement = new Audio();
                audioElement.src = url;
                audioElement.volume = 1.0;
                audioElement.loop = false;
                audioElement.preload = 'auto';

                // Add to DOM (some browsers require this)
                audioElement.style.display = 'none';
                document.body.appendChild(audioElement);

                // Create AudioContext
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                log(`🎵 AudioContext state: ${audioContext.state}`);

                // Create audio analyzer
                audioAnalyzer = new AudioAnalyzer(audioContext);

                // Connect: Audio Element → Analyzer → Destination
                const source = audioContext.createMediaElementSource(audioElement);
                source.connect(audioAnalyzer.analyser);
                audioAnalyzer.analyser.connect(audioContext.destination);

                engine.audioAnalyzer = audioAnalyzer;

                log(`✅ Loaded: ${file.name}`);
                log('🔊 Click PLAY button to start');

            } catch (err) {
                log(`❌ Load error: ${err.message}`);
                console.error(err);
            }
        };

        document.getElementById('playBtn').onclick = async () => {
            if (!audioElement) {
                log('⚠️ Load audio file first!');
                return;
            }

            try {
                log('🎬 Starting playback...');

                // Resume AudioContext first
                if (audioContext && audioContext.state === 'suspended') {
                    await audioContext.resume();
                    log(`✅ AudioContext resumed: ${audioContext.state}`);
                }

                // Play audio
                await audioElement.play();
                log('✅ AUDIO PLAYING! 🔊');
                log(`Volume: ${audioElement.volume * 100}%`);

            } catch (err) {
                log(`❌ Play error: ${err.message}`);
                console.error(err);

                // Try alternative method
                if (audioContext) {
                    try {
                        await audioContext.resume();
                        await audioElement.play();
                        log('✅ Retry successful!');
                    } catch (retryErr) {
                        log(`❌ Retry failed: ${retryErr.message}`);
                    }
                }
            }
        };

        document.getElementById('pauseBtn').onclick = () => {
            if (audioElement) {
                audioElement.pause();
                log('⏸️ Paused');
            }
        };

        document.getElementById('stopChoreography').onclick = () => {
            engine.stop();
            statusEl.textContent = 'Stopped';
            statusEl.style.color = '#f00';
            log('⏹️ Choreography stopped');
        };

        document.getElementById('clearSequences').onclick = () => {
            engine.activeSequences = [];
            log('🧹 Cleared active sequences');
        };

        // Rotation patterns
        const patternsContainer = document.getElementById('rotationPatterns');
        rotationChoreographer.getPatternNames().forEach(name => {
            const btn = document.createElement('button');
            btn.textContent = name.replace(/_/g, ' ');
            btn.onclick = () => {
                rotationChoreographer.setPattern(name);
                document.querySelectorAll('#rotationPatterns button').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                log(`🌀 Pattern: ${name}`);
            };
            patternsContainer.appendChild(btn);
        });

        // Sequences
        const sequencesContainer = document.getElementById('sequences');
        engine.sequences.forEach((seq, name) => {
            const btn = document.createElement('button');
            btn.textContent = name.replace(/_/g, ' ');
            btn.onclick = () => {
                engine.startSequence(name, Date.now());
            };
            sequencesContainer.appendChild(btn);
        });

        // Render loop
        function startRenderLoop() {
            function render() {
                if (!engine.running) {
                    requestAnimationFrame(render);
                    return;
                }

                const audioData = audioAnalyzer ? audioAnalyzer.analyze() : engine.getMockAudioData();

                // Update audio level displays
                if (audioData.bands) {
                    bassLevelEl.textContent = `${(audioData.bands.bass * 100).toFixed(0)}%`;
                    midLevelEl.textContent = `${(audioData.bands.mid * 100).toFixed(0)}%`;
                    highLevelEl.textContent = `${(audioData.bands.high * 100).toFixed(0)}%`;
                }
                energyLevelEl.textContent = `${((audioData.rms || 0) * 100).toFixed(0)}%`;
                onsetLevelEl.textContent = `${((audioData.onset || 0) * 100).toFixed(0)}%`;

                // Set global audio reactive
                window.audioEnabled = true;
                window.audioReactive = {
                    bass: audioData.bands?.bass || 0.3,
                    mid: audioData.bands?.mid || 0.3,
                    high: audioData.bands?.high || 0.3,
                    energy: audioData.rms || 0.3
                };

                // Check triggers with custom thresholds
                if (audioData.bands?.bass > bassThreshold && audioData.onset > onsetThreshold) {
                    // Manual trigger check for sequences
                    engine.checkTriggers(audioData);
                }

                const rotations = rotationChoreographer.update(
                    audioData,
                    (Date.now() - engine.startTime) / 1000,
                    engine.currentBeat,
                    16
                );

                shaderChoreographer.update(
                    audioData,
                    (engine.currentBeat % engine.beatsPerMeasure) / engine.beatsPerMeasure,
                    engine.currentBeat,
                    engine.currentMeasure,
                    Date.now()
                );

                if (currentVisualizer.updateParameter) {
                    currentVisualizer.updateParameter('rot4dXW', rotations.rot4dXW);
                    currentVisualizer.updateParameter('rot4dYW', rotations.rot4dYW);
                    currentVisualizer.updateParameter('rot4dZW', rotations.rot4dZW);
                }

                if (currentVisualizer.render) {
                    currentVisualizer.render();
                }

                requestAnimationFrame(render);
            }
            render();
        }

        bpmEl.textContent = engine.bpm;
        log('🌌 VIB34D Enhanced Choreography initialized');
        log('🎚️ Adjust thresholds to customize reactivity');

        engine.start();
        statusEl.textContent = 'Running';
        statusEl.style.color = '#0f0';
        startRenderLoop();
        log('✨ Auto-started visualization');
    </script>
</body>
</html>
