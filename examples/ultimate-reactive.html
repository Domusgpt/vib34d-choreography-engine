<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIB34D Ultimate Reactive Console</title>
    <link rel="stylesheet" href="./css/ultimate-console.css">
</head>
<body>
    <div id="appShell">
        <canvas id="mainCanvas"></canvas>
        <div id="consoleHost"></div>
    </div>
    <script type="module">
        import { launchUltimateConsole } from './js/ultimateConsole.js';
        const params = new URLSearchParams(window.location.search);
        const layout = params.get('layout') || 'auto';
        try {
            await launchUltimateConsole({
                canvasId: 'mainCanvas',
                hostId: 'consoleHost',
                layout,
            });
        } catch (error) {
            console.error('Failed to launch Ultimate Console', error);
        }
    </script>
</body>
</html>
