<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visualizer demos</title>
  <meta http-equiv="refresh" content="0; url=./INDEX.html" />
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #020b0b;
      color: #cfffff;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .notice {
      text-align: center;
      padding: 24px;
      border: 1px solid #0ff;
      border-radius: 12px;
      background: rgba(0, 255, 255, 0.05);
      max-width: 480px;
      box-shadow: 0 6px 24px rgba(0, 255, 255, 0.12);
    }
    .notice h1 {
      font-size: 1.1rem;
      margin: 0 0 12px;
      color: #9ff;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .notice p {
      margin: 0;
      line-height: 1.6;
    }
    .notice a {
      color: #0ff;
      font-weight: 700;
    }
  </style>
</head>
<body>
  <div class="notice">
    <h1>Redirecting to the demo index…</h1>
    <p>
      If your browser does not redirect automatically, open
      <a href="./INDEX.html">examples/INDEX.html</a> to browse the visualizers.
    </p>
  </div>
</body>
</html>
